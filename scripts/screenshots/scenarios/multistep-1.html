<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>选择迁移方案</title>
    <style>
      :root {
        color-scheme: light;
        --page-bg: #f4f7fb;
        --surface: #ffffff;
        --text: #16202f;
        --muted: #5d6b80;
        --border: #dde5ef;
        --accent: #2563eb;
        --accent-soft: #eef4ff;
        --ok: #147a4d;
        --ok-soft: #e9f7ef;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 3rem 1.5rem;
        background:
          radial-gradient(48rem 26rem at 50% -12%, rgba(37, 99, 235, 0.1), transparent 70%),
          var(--page-bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        line-height: 1.55;
      }

      main {
        width: 100%;
        max-width: 46rem;
        margin: 0 auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 1px 2px rgba(20, 34, 54, 0.04), 0 28px 56px -32px rgba(20, 34, 54, 0.3);
        padding: 2rem 2.25rem 2.25rem;
      }

      .steps {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1.35rem;
        font-size: 0.76rem;
        color: var(--muted);
      }

      .step {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.22rem 0.55rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #fff;
      }

      .step.done { background: var(--ok-soft); border-color: #bfe6d1; color: var(--ok); }
      .step.current { background: var(--accent-soft); border-color: #c3d6fb; color: #1d4ed8; font-weight: 600; }

      .step i {
        font-style: normal;
        display: grid;
        place-items: center;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: currentColor;
        color: #fff;
        font-size: 0.6rem;
        font-weight: 700;
      }

      .sep { opacity: 0.5; }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin-bottom: 0.9rem;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        background: var(--accent-soft);
        color: #1d4ed8;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }

      h1 {
        margin: 0 0 0.4rem;
        font-size: 1.5rem;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }

      .lede {
        margin: 0 0 1.5rem;
        color: var(--muted);
        font-size: 0.94rem;
      }

      .options {
        display: grid;
        gap: 0.75rem;
        margin: 0;
        padding: 0;
        border: 0;
      }

      .option {
        position: relative;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.9rem;
        padding: 1rem 1.1rem;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fff;
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      }

      .option:hover { border-color: #b9c9de; }

      .option:has(input:checked) {
        border-color: var(--accent);
        background: var(--accent-soft);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      .option input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .dot {
        margin-top: 0.28rem;
        width: 18px;
        height: 18px;
        border: 1.5px solid #b6c3d6;
        border-radius: 50%;
        background: #fff;
        flex: none;
      }

      .option:has(input:checked) .dot {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 18px var(--accent);
      }

      .option strong { display: block; font-size: 0.98rem; font-weight: 600; }
      .option p { margin: 0.3rem 0 0; color: var(--muted); font-size: 0.84rem; }

      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: 0.6rem;
      }

      .fact {
        padding: 0.16rem 0.5rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: #fbfdff;
        color: #4a5871;
        font-size: 0.73rem;
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-top: 1.75rem;
        padding-top: 1.35rem;
        border-top: 1px solid var(--border);
      }

      #status { color: var(--muted); font-size: 0.85rem; }

      button {
        font: inherit;
        border-radius: 10px;
        padding: 0.68rem 1.15rem;
        cursor: pointer;
        border: 1px solid transparent;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        box-shadow: 0 8px 18px -10px rgba(37, 99, 235, 0.9);
      }

      button:hover { background: #1d4ed8; }

      @media (max-width: 34rem) {
        body { padding: 1.25rem 0.9rem; }
        main { padding: 1.4rem 1.15rem 1.6rem; border-radius: 14px; }
        .steps { flex-wrap: wrap; }
        .actions { flex-direction: column-reverse; align-items: stretch; }
        .actions button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <nav class="steps" aria-label="进度">
        <span class="step done"><i>✓</i>检查完成</span>
        <span class="sep">→</span>
        <span class="step current"><i>2</i>选择方案</span>
        <span class="sep">→</span>
        <span class="step"><i>3</i>确认参数</span>
      </nav>

      <span class="eyebrow">migration · step 1 of 2</span>
      <h1>选择数据库迁移方案</h1>
      <p class="lede">
        检测到 12 张表需要迁移，预计影响 480 万行数据。两种方案的停机时间与风险不同。
      </p>

      <fieldset class="options">
        <label class="option">
          <input type="radio" name="plan" value="online" checked />
          <span class="dot" aria-hidden="true"></span>
          <span>
            <strong>在线迁移（推荐）</strong>
            <p>双写 + 回填，全程不停止写入；完成后切换读路径。</p>
            <span class="facts">
              <span class="fact">停机 0 分钟</span>
              <span class="fact">预计 45 分钟</span>
              <span class="fact">可回滚</span>
            </span>
          </span>
        </label>

        <label class="option">
          <input type="radio" name="plan" value="offline" />
          <span class="dot" aria-hidden="true"></span>
          <span>
            <strong>离线迁移</strong>
            <p>停止写入后一次性导出与导入，流程简单，但期间服务不可写。</p>
            <span class="facts">
              <span class="fact">停机约 12 分钟</span>
              <span class="fact">预计 20 分钟</span>
              <span class="fact">不可回滚</span>
            </span>
          </span>
        </label>
      </fieldset>

      <div class="actions">
        <output id="status" aria-live="polite"></output>
        <button id="submit" type="button">下一步：确认参数</button>
      </div>
    </main>

    <script>
      const button = document.querySelector("#submit");
      const status = document.querySelector("#status");

      button.addEventListener("click", () => {
        const plan = document.querySelector('input[name="plan"]:checked').value;
        const sent = submitToAgent({
          kind: "migration-plan",
          data: { plan, tables: 12, rows: 4_800_000 },
          metadata: { step: 1 },
        });
        if (!sent) {
          status.textContent = "提交内容无效，请重试";
          return;
        }
        button.disabled = true;
        status.textContent = "已提交，正在进入下一步…";
      });
    </script>
  </body>
</html>
