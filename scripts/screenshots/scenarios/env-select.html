<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>选择部署环境</title>
    <style>
      :root {
        color-scheme: light;
        --page-bg: #f4f7fb;
        --surface: #ffffff;
        --text: #16202f;
        --muted: #5d6b80;
        --border: #dde5ef;
        --accent: #2563eb;
        --accent-soft: #eef4ff;
        --warn-bg: #fff8e8;
        --warn-border: #f0d9a6;
        --warn-text: #8a5a08;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 3rem 1.5rem;
        background:
          radial-gradient(48rem 26rem at 50% -12%, rgba(37, 99, 235, 0.1), transparent 70%),
          var(--page-bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        line-height: 1.55;
      }

      main {
        width: 100%;
        max-width: 44rem;
        margin: 0 auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 1px 2px rgba(20, 34, 54, 0.04), 0 28px 56px -32px rgba(20, 34, 54, 0.3);
        padding: 2rem 2.25rem 2.25rem;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin-bottom: 0.9rem;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        background: var(--accent-soft);
        color: #1d4ed8;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }

      h1 {
        margin: 0 0 0.4rem;
        font-size: 1.5rem;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }

      .lede {
        margin: 0 0 1.6rem;
        color: var(--muted);
        font-size: 0.94rem;
      }

      .options {
        display: grid;
        gap: 0.75rem;
        margin: 0;
        padding: 0;
        border: 0;
      }

      .option {
        position: relative;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 0.9rem;
        align-items: center;
        padding: 1rem 1.1rem;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fff;
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      }

      .option:hover { border-color: #b9c9de; }

      .option:has(input:checked) {
        border-color: var(--accent);
        background: var(--accent-soft);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      .option input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .dot {
        width: 18px;
        height: 18px;
        border: 1.5px solid #b6c3d6;
        border-radius: 50%;
        background: #fff;
      }

      .option:has(input:checked) .dot {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 18px var(--accent);
      }

      .option strong {
        display: block;
        font-size: 0.98rem;
        font-weight: 600;
      }

      .option small {
        display: block;
        margin-top: 0.15rem;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .tag {
        padding: 0.18rem 0.5rem;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .tag.safe { background: #e9f7ef; color: #147a4d; }
      .tag.hot { background: #fdecea; color: #b3261e; }

      .notice {
        display: flex;
        gap: 0.65rem;
        margin-top: 1.35rem;
        padding: 0.85rem 1rem;
        border: 1px solid var(--warn-border);
        border-radius: 10px;
        background: var(--warn-bg);
        color: var(--warn-text);
        font-size: 0.86rem;
      }

      .notice strong { font-weight: 650; }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-top: 1.75rem;
        padding-top: 1.35rem;
        border-top: 1px solid var(--border);
      }

      #status { color: var(--muted); font-size: 0.85rem; }

      button {
        font: inherit;
        border-radius: 10px;
        padding: 0.68rem 1.15rem;
        cursor: pointer;
        border: 1px solid transparent;
      }

      .secondary {
        background: #fff;
        border-color: var(--border);
        color: var(--muted);
      }

      .primary {
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        box-shadow: 0 8px 18px -10px rgba(37, 99, 235, 0.9);
      }

      .primary:hover { background: #1d4ed8; }

      @media (max-width: 34rem) {
        body { padding: 1.25rem 0.9rem; }
        main { padding: 1.4rem 1.15rem 1.6rem; border-radius: 14px; }
        .actions { flex-direction: column-reverse; align-items: stretch; }
        .actions button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">deployment · 生产发布</span>
      <h1>选择本次部署的目标环境</h1>
      <p class="lede">版本 <code>v2.14.0</code> 已通过全部检查，请确认要发布到的环境。</p>

      <fieldset class="options">
        <label class="option">
          <input type="radio" name="env" value="staging" />
          <span class="dot" aria-hidden="true"></span>
          <span>
            <strong>Staging</strong>
            <small>预发环境 · 与生产同构，仅内部流量</small>
          </span>
          <span class="tag safe">安全</span>
        </label>
        <label class="option">
          <input type="radio" name="env" value="production" checked />
          <span class="dot" aria-hidden="true"></span>
          <span>
            <strong>Production</strong>
            <small>生产环境 · 影响全部线上用户</small>
          </span>
          <span class="tag hot">高风险</span>
        </label>
      </fieldset>

      <div class="notice">
        <span aria-hidden="true">⚠</span>
        <span>本次发布包含 <strong>3 个数据库迁移</strong>，其中 1 个不可回滚。确认后将立即开始滚动更新。</span>
      </div>

      <div class="actions">
        <output id="status" aria-live="polite"></output>
        <button class="primary" id="submit" type="button">确认部署到 Production</button>
      </div>
    </main>

    <script>
      const button = document.querySelector("#submit");
      const status = document.querySelector("#status");

      button.addEventListener("click", () => {
        const env = document.querySelector('input[name="env"]:checked').value;
        const sent = submitToAgent({
          kind: "deploy-target",
          data: { environment: env, version: "v2.14.0" },
          metadata: { source: "env-select" },
        });
        if (!sent) {
          status.textContent = "提交内容无效，请重试";
          return;
        }
        button.disabled = true;
        button.textContent = "已提交";
        status.textContent = "已提交，正在开始发布…";
      });
    </script>
  </body>
</html>
