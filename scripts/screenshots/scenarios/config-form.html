<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>服务配置</title>
    <style>
      :root {
        color-scheme: light;
        --page-bg: #f4f7fb;
        --surface: #ffffff;
        --text: #16202f;
        --muted: #5d6b80;
        --border: #dde5ef;
        --accent: #2563eb;
        --accent-soft: #eef4ff;
        --danger: #b3261e;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 3rem 1.5rem;
        background:
          radial-gradient(48rem 26rem at 50% -12%, rgba(37, 99, 235, 0.1), transparent 70%),
          var(--page-bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        line-height: 1.55;
      }

      main {
        width: 100%;
        max-width: 44rem;
        margin: 0 auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 1px 2px rgba(20, 34, 54, 0.04), 0 28px 56px -32px rgba(20, 34, 54, 0.3);
        padding: 2rem 2.25rem 2.25rem;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin-bottom: 0.9rem;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        background: var(--accent-soft);
        color: #1d4ed8;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }

      h1 {
        margin: 0 0 0.4rem;
        font-size: 1.5rem;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }

      .lede {
        margin: 0 0 1.6rem;
        color: var(--muted);
        font-size: 0.94rem;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem 1.25rem;
      }

      .field { display: grid; gap: 0.4rem; }
      .field.wide { grid-column: 1 / -1; }

      label {
        font-size: 0.83rem;
        font-weight: 600;
        color: #34425a;
      }

      .hint {
        font-size: 0.76rem;
        font-weight: 400;
        color: var(--muted);
      }

      input[type="text"],
      input[type="number"],
      select,
      textarea {
        width: 100%;
        padding: 0.62rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fff;
        color: var(--text);
        font: inherit;
        font-size: 0.9rem;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
      }

      .inline {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.6rem;
        align-items: center;
      }

      .unit {
        padding: 0.62rem 0.7rem;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #f8fafc;
        color: var(--muted);
        font-size: 0.82rem;
        white-space: nowrap;
      }

      .check {
        display: flex;
        align-items: flex-start;
        gap: 0.6rem;
        padding: 0.75rem 0.85rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fbfdff;
      }

      .check input { margin-top: 0.22rem; accent-color: var(--accent); }
      .check span { font-size: 0.88rem; }
      .check small { display: block; color: var(--muted); font-size: 0.78rem; }

      .conditional {
        margin-top: 0.7rem;
        padding: 0.9rem 1rem;
        border: 1px dashed #c8d6e8;
        border-radius: 10px;
        background: #f9fbfe;
      }

      .error {
        display: none;
        align-items: center;
        gap: 0.4rem;
        color: var(--danger);
        font-size: 0.78rem;
      }

      .error.show { display: flex; }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-top: 1.75rem;
        padding-top: 1.35rem;
        border-top: 1px solid var(--border);
      }

      #status { color: var(--muted); font-size: 0.85rem; }
      #status.bad { color: var(--danger); }

      .buttons { display: flex; gap: 0.6rem; }

      button {
        font: inherit;
        border-radius: 10px;
        padding: 0.68rem 1.15rem;
        cursor: pointer;
        border: 1px solid transparent;
      }

      .secondary {
        background: #fff;
        border-color: var(--border);
        color: var(--muted);
      }

      .primary {
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        box-shadow: 0 8px 18px -10px rgba(37, 99, 235, 0.9);
      }

      .primary:hover { background: #1d4ed8; }

      @media (max-width: 34rem) {
        body { padding: 1.25rem 0.9rem; }
        main { padding: 1.4rem 1.15rem 1.6rem; border-radius: 14px; }
        .grid { grid-template-columns: 1fr; }
        .actions { flex-direction: column-reverse; align-items: stretch; }
        .buttons { flex-direction: column; }
        .buttons button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">service · api-gateway</span>
      <h1>配置本次发布的运行参数</h1>
      <p class="lede">这些参数只作用于新版本实例，现有实例将在滚动更新后替换。</p>

      <div class="grid">
        <div class="field wide">
          <label for="service">服务名称</label>
          <input id="service" type="text" value="api-gateway" />
        </div>

        <div class="field">
          <label for="replicas">实例数量 <span class="hint">2 – 20</span></label>
          <div class="inline">
            <input id="replicas" type="number" min="2" max="20" value="6" />
            <span class="unit">replicas</span>
          </div>
        </div>

        <div class="field">
          <label for="region">运行区域</label>
          <select id="region">
            <option>ap-southeast-1</option>
            <option selected>ap-east-1</option>
            <option>eu-central-1</option>
          </select>
        </div>

        <div class="field">
          <label for="memory">单实例内存上限</label>
          <div class="inline">
            <input id="memory" type="number" min="256" step="128" value="1024" />
            <span class="unit">MiB</span>
          </div>
        </div>

        <div class="field">
          <label for="concurrency">最大并发请求</label>
          <div class="inline">
            <input id="concurrency" type="number" min="10" step="10" value="240" />
            <span class="unit">req/s</span>
          </div>
        </div>

        <div class="field wide">
          <label class="check">
            <input id="canary" type="checkbox" checked />
            <span>
              开启灰度发布
              <small>先向 10% 流量放量，观察 30 分钟后自动全量</small>
            </span>
          </label>

          <div class="conditional">
            <label for="ratio">首批灰度比例</label>
            <div class="inline">
              <input id="ratio" type="number" min="1" max="50" value="10" />
              <span class="unit">%</span>
            </div>
            <div class="error" id="ratio-error">
              <span aria-hidden="true">●</span>
              <span>开启灰度发布时，灰度比例不能为空</span>
            </div>
          </div>
        </div>
      </div>

      <div class="actions">
        <output id="status" aria-live="polite"></output>
        <div class="buttons">
          <button class="secondary" id="reset" type="button">重置</button>
          <button class="primary" id="submit" type="button">应用配置</button>
        </div>
      </div>
    </main>

    <script>
      const button = document.querySelector("#submit");
      const reset = document.querySelector("#reset");
      const status = document.querySelector("#status");
      const canary = document.querySelector("#canary");
      const ratio = document.querySelector("#ratio");
      const ratioError = document.querySelector("#ratio-error");

      canary.addEventListener("change", () => {
        document.querySelector(".conditional").style.opacity = canary.checked ? "1" : "0.45";
        if (!canary.checked) ratioError.classList.remove("show");
      });

      reset.addEventListener("click", () => {
        document.querySelector("#service").value = "api-gateway";
        document.querySelector("#replicas").value = "6";
        document.querySelector("#memory").value = "1024";
        document.querySelector("#concurrency").value = "240";
        canary.checked = true;
        ratio.value = "10";
        ratioError.classList.remove("show");
        status.textContent = "";
        status.classList.remove("bad");
      });

      button.addEventListener("click", () => {
        if (canary.checked && ratio.value.trim() === "") {
          ratioError.classList.add("show");
          ratio.focus();
          status.textContent = "请先补全必填项";
          status.classList.add("bad");
          return;
        }
        const sent = submitToAgent({
          kind: "service-config",
          data: {
            service: document.querySelector("#service").value,
            replicas: Number(document.querySelector("#replicas").value),
            region: document.querySelector("#region").value,
            memoryMiB: Number(document.querySelector("#memory").value),
            maxConcurrency: Number(document.querySelector("#concurrency").value),
            canary: canary.checked,
            canaryRatio: canary.checked ? Number(ratio.value) : null,
          },
          metadata: { source: "config-form" },
        });
        if (!sent) {
          status.textContent = "提交内容无效，请检查后重试";
          status.classList.add("bad");
          return;
        }
        button.disabled = true;
        button.textContent = "已应用";
        status.classList.remove("bad");
        status.textContent = "配置已提交";
      });
    </script>
  </body>
</html>
