<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>确认迁移参数</title>
    <style>
      :root {
        color-scheme: light;
        --page-bg: #f4f7fb;
        --surface: #ffffff;
        --text: #16202f;
        --muted: #5d6b80;
        --border: #dde5ef;
        --accent: #2563eb;
        --accent-soft: #eef4ff;
        --ok: #147a4d;
        --ok-soft: #e9f7ef;
        --warn-bg: #fff8e8;
        --warn-border: #f0d9a6;
        --warn-text: #8a5a08;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 3rem 1.5rem;
        background:
          radial-gradient(48rem 26rem at 50% -12%, rgba(37, 99, 235, 0.1), transparent 70%),
          var(--page-bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        line-height: 1.55;
      }

      main {
        width: 100%;
        max-width: 46rem;
        margin: 0 auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 1px 2px rgba(20, 34, 54, 0.04), 0 28px 56px -32px rgba(20, 34, 54, 0.3);
        padding: 2rem 2.25rem 2.25rem;
      }

      .steps {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1.35rem;
        font-size: 0.76rem;
        color: var(--muted);
      }

      .step {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.22rem 0.55rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #fff;
      }

      .step.done { background: var(--ok-soft); border-color: #bfe6d1; color: var(--ok); }
      .step.current { background: var(--accent-soft); border-color: #c3d6fb; color: #1d4ed8; font-weight: 600; }

      .step i {
        font-style: normal;
        display: grid;
        place-items: center;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: currentColor;
        color: #fff;
        font-size: 0.6rem;
        font-weight: 700;
      }

      .sep { opacity: 0.5; }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin-bottom: 0.9rem;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        background: var(--accent-soft);
        color: #1d4ed8;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }

      h1 {
        margin: 0 0 0.4rem;
        font-size: 1.5rem;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }

      .lede {
        margin: 0 0 1.5rem;
        color: var(--muted);
        font-size: 0.94rem;
      }

      .recap {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        padding: 0.7rem 0.9rem;
        border: 1px solid #c3d6fb;
        border-radius: 10px;
        background: var(--accent-soft);
        font-size: 0.85rem;
      }

      .recap b { font-weight: 650; }
      .recap .change { margin-left: auto; color: #1d4ed8; font-size: 0.78rem; }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem 1.25rem;
      }

      .field { display: grid; gap: 0.4rem; }
      .field.wide { grid-column: 1 / -1; }

      label {
        font-size: 0.83rem;
        font-weight: 600;
        color: #34425a;
      }

      .hint {
        font-size: 0.76rem;
        font-weight: 400;
        color: var(--muted);
      }

      input[type="text"],
      input[type="number"],
      select {
        width: 100%;
        padding: 0.62rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fff;
        color: var(--text);
        font: inherit;
        font-size: 0.9rem;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
      }

      .inline {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.6rem;
        align-items: center;
      }

      .unit {
        padding: 0.62rem 0.7rem;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #f8fafc;
        color: var(--muted);
        font-size: 0.82rem;
        white-space: nowrap;
      }

      .notice {
        display: flex;
        gap: 0.65rem;
        margin-top: 1.35rem;
        padding: 0.85rem 1rem;
        border: 1px solid var(--warn-border);
        border-radius: 10px;
        background: var(--warn-bg);
        color: var(--warn-text);
        font-size: 0.86rem;
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-top: 1.75rem;
        padding-top: 1.35rem;
        border-top: 1px solid var(--border);
      }

      #status { color: var(--muted); font-size: 0.85rem; }

      .buttons { display: flex; gap: 0.6rem; }

      button {
        font: inherit;
        border-radius: 10px;
        padding: 0.68rem 1.15rem;
        cursor: pointer;
        border: 1px solid transparent;
      }

      .secondary {
        background: #fff;
        border-color: var(--border);
        color: var(--muted);
      }

      .primary {
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        box-shadow: 0 8px 18px -10px rgba(37, 99, 235, 0.9);
      }

      .primary:hover { background: #1d4ed8; }

      @media (max-width: 34rem) {
        body { padding: 1.25rem 0.9rem; }
        main { padding: 1.4rem 1.15rem 1.6rem; border-radius: 14px; }
        .steps { flex-wrap: wrap; }
        .grid { grid-template-columns: 1fr; }
        .actions { flex-direction: column-reverse; align-items: stretch; }
        .buttons { flex-direction: column; }
        .buttons button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <nav class="steps" aria-label="进度">
        <span class="step done"><i>✓</i>检查完成</span>
        <span class="sep">→</span>
        <span class="step done"><i>✓</i>选择方案</span>
        <span class="sep">→</span>
        <span class="step current"><i>3</i>确认参数</span>
      </nav>

      <span class="eyebrow">migration · step 2 of 2</span>
      <h1>确认在线迁移参数</h1>
      <p class="lede">开始后将在后台持续回填，可随时暂停。请确认批次与限速设置。</p>

      <div class="recap">
        <span>已选择：</span>
        <b>在线迁移</b>
        <span class="change">上一步的选择已记录</span>
      </div>

      <div class="grid">
        <div class="field">
          <label for="batch">每批行数</label>
          <div class="inline">
            <input id="batch" type="number" min="500" step="500" value="5000" />
            <span class="unit">rows</span>
          </div>
        </div>

        <div class="field">
          <label for="rps">回填速率上限</label>
          <div class="inline">
            <input id="rps" type="number" min="50" step="50" value="800" />
            <span class="unit">rows/s</span>
          </div>
        </div>

        <div class="field">
          <label for="window">允许执行时段</label>
          <select id="window">
            <option selected>全天（低峰优先）</option>
            <option>仅 22:00 – 06:00</option>
            <option>仅周末</option>
          </select>
        </div>

        <div class="field">
          <label for="checksum">校验方式</label>
          <select id="checksum">
            <option selected>逐表校验和</option>
            <option>抽样校验（10%）</option>
            <option>不校验</option>
          </select>
        </div>

        <div class="field wide">
          <label for="owner">变更负责人 <span class="hint">用于回滚时联系</span></label>
          <input id="owner" type="text" value="gavin@platform" />
        </div>
      </div>

      <div class="notice">
        <span aria-hidden="true">⚠</span>
        <span>预计回填耗时 <strong>约 45 分钟</strong>。期间新写入会双写，存储占用约增加 1.8×。</span>
      </div>

      <div class="actions">
        <output id="status" aria-live="polite"></output>
        <div class="buttons">
          <button class="secondary" id="back" type="button">返回修改方案</button>
          <button class="primary" id="submit" type="button">开始迁移</button>
        </div>
      </div>
    </main>

    <script>
      const button = document.querySelector("#submit");
      const back = document.querySelector("#back");
      const status = document.querySelector("#status");

      back.addEventListener("click", () => {
        status.textContent = "已请求返回上一步";
      });

      button.addEventListener("click", () => {
        const sent = submitToAgent({
          kind: "migration-params",
          data: {
            plan: "online",
            batchSize: Number(document.querySelector("#batch").value),
            maxRowsPerSecond: Number(document.querySelector("#rps").value),
            window: document.querySelector("#window").value,
            checksum: document.querySelector("#checksum").value,
            owner: document.querySelector("#owner").value,
          },
          metadata: { step: 2 },
        });
        if (!sent) {
          status.textContent = "提交内容无效，请重试";
          return;
        }
        button.disabled = true;
        button.textContent = "迁移已启动";
        status.textContent = "参数已提交";
      });
    </script>
  </body>
</html>
